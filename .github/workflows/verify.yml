name: Verify
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: node src/generate-report.mjs --check data/daily.example.json
      - name: Verify latest committed report quality gate
        run: |
          latest=$(find data -maxdepth 1 -type f -name '????-??-??.json' | sort | tail -1)
          npm run quality -- "$latest"
